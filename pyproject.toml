[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev_team"
version = "0.1.0"
description = "A from-scratch multi-agent software engineering team (Lead + Backend + Frontend agents). Zero deps, backend-agnostic."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []   # zero third-party deps — pure stdlib + OpenAI-compatible HTTP

[project.scripts]
dev_team = "dev_team.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dev_team*"]

[tool.setuptools.package-data]
dev_team = ["py.typed"]
